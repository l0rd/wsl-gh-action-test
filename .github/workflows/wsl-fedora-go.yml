name: WSL Fedora Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Enable WSL
        shell: pwsh
        run: wsl --install --no-distribution

      - name: Download Fedora rootfs
        shell: pwsh
        run: |
          $craneUrl = "https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Windows_x86_64.tar.gz"
          Invoke-WebRequest -Uri $craneUrl -OutFile crane.tar.gz
          tar xf crane.tar.gz crane.exe
          .\crane.exe export quay.io/podman/machine-os@sha256:c1b05f0f5f5cdbbfb2be4e23fccfbd0436f3aa6bfa6d4705daed00a251b03943 fedora-rootfs.tar

      - name: Import Fedora into WSL
        shell: pwsh
        env:
          WSL_UTF8: '1'
        run: |
          New-Item -Path $env:USERPROFILE\wsl\fedora -ItemType Directory -Force
          wsl --import PodmanMachineOS61 $env:USERPROFILE\wsl\fedora fedora-rootfs.tar
          wsl -d PodmanMachineOS61 -- cat /etc/os-release

      - name: Install Go and ca-certificates
        shell: pwsh
        env:
          WSL_UTF8: '1'
        run: wsl -d PodmanMachineOS61 -- dnf install -y golang ca-certificates

      - name: Routes
        shell: pwsh
        env:
          WSL_UTF8: '1'
        run: wsl -d PodmanMachineOS61 -- ip route show

      - name: Run Go Hello World
        shell: pwsh
        env:
          WSL_UTF8: '1'
        run: wsl -d PodmanMachineOS61 --cd "${{ github.workspace }}" -- go run main.go

      - name: Allow WSL inbound traffic
        shell: pwsh
        run: |
          Set-NetFirewallHyperVVMSetting -Name '{40E0AC32-46A5-438A-A0B2-2B479E8F2E90}' -DefaultInboundAction Allow
          New-NetFirewallRule -DisplayName "Allow Python HTTP 8000" -Direction Inbound -Protocol TCP -LocalPort 8000 -Action Allow

      - name: Start HTTP server on host
        shell: pwsh
        run: |
          Start-Process -NoNewWindow python -ArgumentList '-m', 'http.server', '8000'
          Start-Sleep -Seconds 2

      - name: Test WSL to host connectivity
        shell: pwsh
        env:
          WSL_UTF8: '1'
        run: |
          $hostIP = wsl -d PodmanMachineOS61 --cd "${{ github.workspace }}" -- go run main.go
          Write-Host "Host IP: $hostIP"
          wsl -d PodmanMachineOS61 -- curl -s -o /dev/null -w '%{http_code}' --connect-timeout 5 "http://${hostIP}:8000"

      - name: HyperV Firewall
        shell: pwsh
        run: Get-NetFirewallHyperVVMSetting -PolicyStore ActiveStore -Name '{40E0AC32-46A5-438A-A0B2-2B479E8F2E90}'
