name: WSL Fedora Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Enable WSL
        shell: pwsh
        run: wsl --install --no-distribution

      - name: Download Fedora rootfs
        shell: pwsh
        run: |
          $craneUrl = "https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Windows_x86_64.tar.gz"
          Invoke-WebRequest -Uri $craneUrl -OutFile crane.tar.gz
          tar xf crane.tar.gz crane.exe
          .\crane.exe export quay.io/podman/machine-os@sha256:473ba5bad8d2ffb1b0510af72a00c68edcd7f868ed8c0c0762e36cf901a0ca06 fedora-rootfs.tar

      - name: Import Fedora into WSL
        shell: pwsh
        env:
          WSL_UTF8: '1'
        run: |
          New-Item -Path $env:USERPROFILE\wsl\fedora -ItemType Directory -Force
          wsl --import PodmanMachineOS61 $env:USERPROFILE\wsl\fedora fedora-rootfs.tar
          wsl -d PodmanMachineOS61 -- cat /etc/os-release

      - name: Install Go and ca-certificates
        shell: pwsh
        env:
          WSL_UTF8: '1'
        run: wsl -d PodmanMachineOS61 -- dnf install -y golang ca-certificates

      - name: Routes
        shell: pwsh
        env:
          WSL_UTF8: '1'
        run: wsl -d PodmanMachineOS61 -- ip route show

      - name: Run Go Hello World
        shell: pwsh
        env:
          WSL_UTF8: '1'
        run: wsl -d PodmanMachineOS61 --cd "${{ github.workspace }}" -- go run main.go

      - name: HyperV Firewall
        shell: pwsh
        run: Get-NetFirewallHyperVVMSetting -PolicyStore ActiveStore -Name '{40E0AC32-46A5-438A-A0B2-2B479E8F2E90}'
